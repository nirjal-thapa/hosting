# CI/CD: every push to the main branch deploys the new code to the AWS server.
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on GitHub to deploy by hand

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to the server and run the deploy script
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }} # contents of your .pem key file
          HOST: ${{ secrets.EC2_HOST }} # your server's public IP address
        run: |
          if [ -z "$HOST" ]; then
            echo "EC2_HOST secret is not set yet, so there is no server to deploy to. Skipping."
            exit 0
          fi
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new ubuntu@"$HOST" "bash ~/hosting/deploy/deploy.sh"
